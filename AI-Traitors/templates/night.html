<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Night Phase - AI Traitors</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

<div class="container">

    <div class="night-screen">

        <div class="night-icon">
            🌙
        </div>

        <h1>NIGHT PHASE</h1>

        <p class="subtitle">
            The city is asleep...
        </p>


        <div class="panel">

            <h2>😈 Traitor's Turn</h2>

            <p>
                The Traitor must secretly choose
                one player to eliminate.
            </p>


            <form action="/night-action" method="POST">

                <label>
                    Choose your target:
                </label>

                <br><br>


                <select name="target" required>

                    {% for player in targets %}

                    <option value="{{ player }}">
                        {{ player }}
                    </option>

                    {% endfor %}

                </select>


                <br><br>


                <button type="submit">
                    ☠️ ELIMINATE PLAYER
                </button>

            </form>

        </div>


        <div class="panel">

            <p>
                ⚠️ Keep this choice secret!
            </p>

        </div>

    </div>

</div>

</body>

</html>
